function renderCloset(root){
  const f = state.filters;
  let items = state.items.filter(i=>{
    if(f.cat!=='all' && i.category!==f.cat) return false;
    if(f.laundry && i.laundryStatus!=='dirty') return false;
    if(f.q && !(i.name.toLowerCase().includes(f.q.toLowerCase()) || (i.color||'').toLowerCase().includes(f.q.toLowerCase()))) return false;
    return true;
  });
  if(f.sort==='recent') items = items.slice().sort((a,b)=> b.createdAt - a.createdAt);
  if(f.sort==='most') items = items.slice().sort((a,b)=> (b.wearCount||0)-(a.wearCount||0));
  if(f.sort==='least') items = items.slice().sort((a,b)=> (a.wearCount||0)-(b.wearCount||0));
  const dirtyCount = state.items.filter(i=>i.laundryStatus==='dirty').length;

  root.innerHTML = `
    <div class="view-header">
      <div><h2>Closet</h2><div class="view-sub">${state.items.length} item${state.items.length===1?'':'s'} saved</div></div>
      <div style="display:flex; gap:8px;">
        <button class="btn btn-ghost" id="add-multiple-btn">📸 Add multiple</button>
        <button class="btn btn-primary" id="add-item-btn">${ICONS.plus}Add item</button>
      </div>
    </div>
    <div class="filter-bar">
      <div class="chip ${f.cat==='all'?'active':''}" data-cat="all">All</div>
      ${CATEGORIES.map(c=>`<div class="chip ${f.cat===c?'active':''}" data-cat="${c}">${CAT_LABEL[c]}</div>`).join('')}
      <div class="chip ${f.laundry?'active':''}" id="laundry-chip" style="${f.laundry?'':'border-color:var(--danger); color:var(--danger);'}">🧺 Needs wash${dirtyCount?' ('+dirtyCount+')':''}</div>
      <input class="search-input" placeholder="Search name or color…" id="search-input" value="${f.q}">
      <select id="sort-select">
        <option value="recent" ${f.sort==='recent'?'selected':''}>Recently added</option>
        <option value="most" ${f.sort==='most'?'selected':''}>Most worn</option>
        <option value="least" ${f.sort==='least'?'selected':''}>Least worn</option>
      </select>
    </div>
    ${ f.laundry && items.length>0 ? `<button class="btn btn-ghost" id="bulk-wash-btn" style="margin-bottom:16px;">🧼 Mark all ${items.length} as washed</button>` : '' }
    ${ items.length===0 ? emptyClosetState(f.laundry) : `<div class="grid">${items.map(itemCard).join('')}</div>` }
  `;
  root.querySelectorAll('.chip[data-cat]').forEach(el=> el.addEventListener('click', ()=>{ f.cat = el.dataset.cat; renderView(); }));
  root.querySelector('#laundry-chip').addEventListener('click', ()=>{ f.laundry = !f.laundry; renderView(); });
  root.querySelector('#search-input').addEventListener('input', e=>{ f.q = e.target.value; renderView(); });
  root.querySelector('#sort-select').addEventListener('change', e=>{ f.sort = e.target.value; renderView(); });
  root.querySelector('#add-item-btn').addEventListener('click', ()=> openItemModal());
  root.querySelector('#add-multiple-btn').addEventListener('click', ()=> openBulkAddModal());
  root.querySelectorAll('.tag-card[data-item]').forEach(el=> el.addEventListener('click', ()=> openItemModal(el.dataset.item)));
  const bulkBtn = root.querySelector('#bulk-wash-btn');
  if(bulkBtn) bulkBtn.addEventListener('click', async ()=>{
    for(const i of items){ markWashed(i); await persistItem(i); }
    toast('Marked as washed ✓'); renderView();
  });
}
function emptyClosetState(laundryMode){
  if(laundryMode){
    return `<div class="empty-state"><h3>Nothing needs washing</h3><p>Everything currently in your closet is clean.</p></div>`;
  }
  return `<div class="empty-state"><h3>Your closet is empty</h3>
    <p>Add your first item — snap a photo of something in your wardrobe to get started.</p>
    <button class="btn btn-primary" onclick="document.getElementById('add-item-btn').click()">${ICONS.plus} Add item</button>
  </div>`;
}
function itemCard(item){
  const dirty = item.laundryStatus==='dirty';
  return `<div class="tag-card" data-item="${item.id}">
    <div class="tag-hole"></div>
    ${item.wearCount>0?`<div class="tag-badge">×${item.wearCount}</div>`:''}
    <div class="tag-photo">${item.image?`<img src="${item.image}">`:`<span class="ph-icon">👕</span>`}</div>
    <div class="tag-name">${escapeHtml(item.name)}</div>
    <div class="tag-meta mono">${CAT_LABEL[item.category]||''} ${item.color?'· '+(item.colorHex?`<span class="color-dot" style="background:${item.colorHex}"></span>`:'')+escapeHtml(item.color):''}</div>
    ${dirty?`<div class="tag-meta mono" style="color:var(--danger); font-weight:700; margin-top:2px;">NEEDS WASH</div>`:''}
  </div>`;
}
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---- Item modal (add/edit) ---- */
function openItemModal(itemId){
  const existing = itemId ? state.items.find(i=>i.id===itemId) : null;
  const draft = existing ? {...existing, vibes:[...(existing.vibes||[])]} : {
    id:uid(), name:'', category:'top', color:'', colorHex:null, seasons:['all-season'], vibes:[], image:null,
    wearCount:0, lastWorn:null, wearHistory:[], createdAt:Date.now(),
    laundryStatus:'clean', wearsSinceWash:0, wearsBeforeWash: LAUNDRY_DEFAULT['top']
  };
  if(draft.wearsBeforeWash==null) draft.wearsBeforeWash = LAUNDRY_DEFAULT[draft.category] || 0;
  if(!draft.laundryStatus) draft.laundryStatus = 'clean';
  let removeBgOn = true;
  const overlay = document.createElement('div');
  overlay.className='overlay';
  function laundryBtnLabel(){ return draft.laundryStatus==='dirty' ? '🧼 Mark as washed' : '🧺 Mark as needs wash'; }
  function isPresetSelected(c){ return draft.color===c.name && draft.colorHex===c.hex; }
  function colorSwatchesHtml(){
    const isCustom = draft.color==='Custom' && draft.colorHex;
    return `<div class="color-swatch-grid" id="color-swatch-grid">
      ${COLOR_PRESETS.map(c=>`<div class="color-swatch ${isPresetSelected(c)?'selected':''}" data-name="${c.name}" data-hex="${c.hex}" style="background:${c.hex}" title="${c.name}"></div>`).join('')}
      <div class="color-swatch custom-swatch ${isCustom?'selected':''}" id="custom-color-swatch" title="Custom color"
        style="${isCustom?`background:${draft.colorHex}`:''}">${isCustom?'':'🎨'}</div>
    </div>
    <input type="color" id="custom-color-input" style="position:absolute; width:1px; height:1px; opacity:0; pointer-events:none;">
    <div class="color-name-label" id="color-name-label">${draft.color? 'Selected: '+escapeHtml(draft.color) : 'Pick a color (optional, helps outfit matching)'}</div>`;
  }
  overlay.innerHTML = `
    <div class="modal">
      <h3>${existing?'Edit item':'Add item'}</h3>
      <div class="photo-upload" id="photo-upload">
        ${draft.image?`<img src="${draft.image}">`:''}
        <span class="hint" ${draft.image?'style="display:none"':''}>📷 Tap to add a photo</span>
      </div>
      <div class="photo-source-buttons">
        <button class="btn btn-ghost" id="take-photo-btn" type="button">📷 Take a photo</button>
        <button class="btn btn-ghost" id="choose-photo-btn" type="button">🖼️ Choose from library</button>
      </div>
      <label class="bg-remove-toggle"><input type="checkbox" id="remove-bg-toggle" checked> ✂️ Remove background automatically</label>
      <input type="file" accept="image/*" id="photo-input" style="display:none">
      <div class="field"><label>Name</label><input type="text" id="f-name" placeholder="e.g. Blue denim jacket" value="${escapeHtml(draft.name)}"></div>
      <div class="field"><label>Category</label>
        <div class="cat-chips">${CATEGORIES.map(c=>`<div class="chip cat-opt ${draft.category===c?'active':''}" data-cat="${c}">${CAT_LABEL[c]}</div>`).join('')}</div>
      </div>
      <div class="field"><label>Color</label>${colorSwatchesHtml()}</div>
      <div class="field"><label>Season</label>
        <div class="season-chips">${SEASONS.map(s=>`<div class="chip season-opt ${draft.seasons.includes(s)?'active':''}" data-s="${s}">${s[0].toUpperCase()+s.slice(1)}</div>`).join('')}</div>
      </div>
      <div class="field"><label>Best for (occasions)</label>
        <div class="season-chips">${VIBES.map(v=>`<div class="chip vibe-opt ${draft.vibes.includes(v)?'active':''}" data-v="${v}">${VIBE_LABEL[v]}</div>`).join('')}</div>
        <div class="view-sub" style="margin-top:5px;">Leave blank if it fits any occasion.</div>
      </div>
      <div class="field"><label>Laundry</label>
        <div style="display:flex; align-items:center; gap:10px; margin-bottom:8px;">
          <button class="btn btn-ghost" id="laundry-toggle-btn" type="button">${laundryBtnLabel()}</button>
          <span class="view-sub" id="laundry-status-label">${draft.laundryStatus==='dirty'?'Currently needs wash':'Currently clean'}</span>
        </div>
        <label style="display:block; font-size:12px; color:var(--ink-muted); margin-bottom:4px;">Wears before wash (0 = track manually)</label>
        <input type="text" inputmode="numeric" id="f-wearsbeforewash" value="${draft.wearsBeforeWash}" style="max-width:90px;">
      </div>
      ${existing?`<div class="field"><label>Wear history</label><div class="view-sub">Worn ${draft.wearCount||0}× · Last worn ${fmtDate(draft.lastWorn)}</div></div>`:''}
      <div class="modal-actions">
        <div>${existing?`<button class="btn-danger" id="del-btn">Delete item</button>`:''}</div>
        <div style="display:flex; align-items:center; gap:8px;">
          <span class="view-sub" id="photo-status-note" style="display:none;">Finishing photo…</span>
          <button class="btn btn-ghost" id="cancel-btn">Cancel</button>
          <button class="btn btn-primary" id="save-btn">Save</button>
        </div>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  let photoProcessing = false;
  function setPhotoProcessing(on){
    photoProcessing = on;
    const saveBtn = overlay.querySelector('#save-btn');
    const note = overlay.querySelector('#photo-status-note');
    if(saveBtn) saveBtn.disabled = on;
    if(note) note.style.display = on ? 'inline' : 'none';
  }
  overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });
  overlay.querySelector('#cancel-btn').addEventListener('click', ()=> overlay.remove());
  overlay.querySelector('#remove-bg-toggle').addEventListener('change', e=>{ removeBgOn = e.target.checked; });
  async function processAndSetPhoto(file){
    const uploadEl = overlay.querySelector('#photo-upload');
    uploadEl.innerHTML = `<div class="photo-processing"><div class="spinner"></div><span>${removeBgOn? 'Removing background… (first time may take a bit — feel free to keep filling in the fields below)' : 'Processing photo…'}</span></div>`;
    setPhotoProcessing(true);
    try{
      const dataUrl = await fileToProcessedDataURL(file, removeBgOn);
      draft.image = dataUrl;
      overlay.querySelector('#photo-upload').innerHTML = `<img src="${dataUrl}">`;
    }catch(err){
      toast('Could not read that photo — try another.');
      overlay.querySelector('#photo-upload').innerHTML = `<span class="hint">📷 Tap to add a photo</span>`;
    } finally {
      setPhotoProcessing(false);
    }
  }
  overlay.querySelector('#photo-upload').addEventListener('click', ()=> overlay.querySelector('#photo-input').click());
  overlay.querySelector('#choose-photo-btn').addEventListener('click', ()=> overlay.querySelector('#photo-input').click());
  overlay.querySelector('#take-photo-btn').addEventListener('click', ()=> openCameraCapture(draft.category, (file)=> processAndSetPhoto(file)));
  overlay.querySelector('#photo-input').addEventListener('change', async (e)=>{
    const file = e.target.files[0]; if(!file) return;
    await processAndSetPhoto(file);
  });
  overlay.querySelectorAll('.cat-opt').forEach(el=> el.addEventListener('click', ()=>{
    draft.category = el.dataset.cat;
    overlay.querySelectorAll('.cat-opt').forEach(o=>o.classList.toggle('active', o.dataset.cat===draft.category));
    if(!existing){
      draft.wearsBeforeWash = LAUNDRY_DEFAULT[draft.category] || 0;
      const wbw = overlay.querySelector('#f-wearsbeforewash');
      if(wbw) wbw.value = draft.wearsBeforeWash;
    }
  }));
  function refreshColorUI(){
    const field = overlay.querySelector('#color-swatch-grid').parentElement;
    field.innerHTML = colorSwatchesHtml();
    bindColorEvents();
  }
  function bindColorEvents(){
    overlay.querySelectorAll('.color-swatch[data-name]').forEach(el=> el.addEventListener('click', ()=>{
      draft.color = el.dataset.name; draft.colorHex = el.dataset.hex;
      refreshColorUI();
    }));
    const customSwatch = overlay.querySelector('#custom-color-swatch');
    const customInput = overlay.querySelector('#custom-color-input');
    if(customSwatch && customInput){
      customSwatch.addEventListener('click', ()=> customInput.click());
      customInput.addEventListener('input', e=>{
        draft.color = 'Custom'; draft.colorHex = e.target.value;
        refreshColorUI();
      });
    }
  }
  bindColorEvents();
  overlay.querySelectorAll('.season-opt').forEach(el=> el.addEventListener('click', ()=>{
    const s = el.dataset.s;
    if(draft.seasons.includes(s)){ draft.seasons = draft.seasons.filter(x=>x!==s); } else { draft.seasons.push(s); }
    el.classList.toggle('active');
  }));
  overlay.querySelectorAll('.vibe-opt').forEach(el=> el.addEventListener('click', ()=>{
    const v = el.dataset.v;
    if(draft.vibes.includes(v)){ draft.vibes = draft.vibes.filter(x=>x!==v); } else { draft.vibes.push(v); }
    el.classList.toggle('active');
  }));
  overlay.querySelector('#laundry-toggle-btn').addEventListener('click', ()=>{
    draft.laundryStatus = draft.laundryStatus==='dirty' ? 'clean' : 'dirty';
    if(draft.laundryStatus==='clean') draft.wearsSinceWash = 0;
    overlay.querySelector('#laundry-toggle-btn').textContent = laundryBtnLabel();
    overlay.querySelector('#laundry-status-label').textContent = draft.laundryStatus==='dirty' ? 'Currently needs wash' : 'Currently clean';
  });
  if(existing){
    overlay.querySelector('#del-btn').addEventListener('click', async ()=>{
      if(!confirm('Delete this item from your closet?')) return;
      state.items = state.items.filter(i=>i.id!==existing.id);
      await deleteItemStorage(existing.id);
      overlay.remove(); toast('Item deleted'); renderView();
    });
  }
  overlay.querySelector('#save-btn').addEventListener('click', async ()=>{
    const name = overlay.querySelector('#f-name').value.trim();
    if(!name){ toast('Give this item a name first'); return; }
    draft.name = name;
    if(draft.seasons.length===0) draft.seasons=['all-season'];
    const wbwVal = parseInt(overlay.querySelector('#f-wearsbeforewash').value, 10);
    draft.wearsBeforeWash = isNaN(wbwVal) ? 0 : Math.max(0, wbwVal);
    if(existing){
      const idx = state.items.findIndex(i=>i.id===existing.id); state.items[idx]=draft;
    } else { state.items.push(draft); }
    await persistItem(draft);
    overlay.remove(); toast(existing?'Item updated':'Item added to closet'); renderView();
  });
}

/* ---- Bulk add: pick several photos, auto-detect color, tap once per photo for category ---- */
function openBulkAddModal(){
  const overlay = document.createElement('div');
  overlay.className = 'builder-overlay';
  document.body.appendChild(overlay);
  let removeBgOn = true;
  let phase = 'select'; // 'select' -> 'processing' -> 'review'
  let queue = []; // {id, file, status:'pending'|'done'|'error', dataUrl, colorHex, colorName, category, pickerOpen}

  function renderPhase(){
    if(phase==='select') renderSelect();
    else if(phase==='processing') renderProcessing();
    else renderReview();
  }
  function renderSelect(){
    overlay.innerHTML = `
      <div class="builder-header"><h3>Add multiple items</h3><button class="btn btn-ghost" id="bulk-close">✕ Close</button></div>
      <div class="builder-main" style="max-width:480px; margin:0 auto;">
        <p class="view-sub" style="margin-bottom:16px;">Pick several photos at once. Hang will remove backgrounds and guess each color automatically — you'll just tap once per photo to set its category.</p>
        <label class="bg-remove-toggle"><input type="checkbox" id="bulk-remove-bg" ${removeBgOn?'checked':''}> ✂️ Remove background automatically</label>
        <button class="btn btn-primary" id="bulk-choose-btn" style="width:100%; justify-content:center; margin-top:6px;">🖼️ Choose photos</button>
        <input type="file" accept="image/*" multiple id="bulk-file-input" style="display:none">
      </div>`;
    overlay.querySelector('#bulk-close').addEventListener('click', ()=> overlay.remove());
    overlay.querySelector('#bulk-remove-bg').addEventListener('change', e=>{ removeBgOn = e.target.checked; });
    overlay.querySelector('#bulk-choose-btn').addEventListener('click', ()=> overlay.querySelector('#bulk-file-input').click());
    overlay.querySelector('#bulk-file-input').addEventListener('change', (e)=>{
      const files = Array.from(e.target.files || []);
      if(files.length===0) return;
      queue = files.map(f=>({ id:uid(), file:f, status:'pending', dataUrl:null, colorHex:null, colorName:null, category:null, pickerOpen:false }));
      phase = 'processing';
      renderPhase();
      processQueue();
    });
  }
  function renderProcessing(){
    const doneCount = queue.filter(q=>q.status!=='pending').length;
    overlay.innerHTML = `
      <div class="builder-header"><h3>Processing photos…</h3><span></span></div>
      <div class="builder-main" style="max-width:480px; margin:0 auto; text-align:center;">
        <div class="photo-processing" style="margin:50px 0;">
          <div class="spinner"></div>
          <span>Processing ${doneCount} of ${queue.length}${removeBgOn? ' — first one may take a bit longer' : ''}</span>
        </div>
      </div>`;
  }
  async function processQueue(){
    for(const q of queue){
      try{
        const dataUrl = await fileToProcessedDataURL(q.file, removeBgOn);
        q.dataUrl = dataUrl;
        const detected = await detectDominantColorHex(dataUrl);
        if(detected){
          q.colorHex = detected;
          q.colorName = nearestPreset(detected).name;
        }
        q.status = 'done';
      }catch(err){
        console.error('bulk item failed', err);
        q.status = 'error';
      }
      if(phase==='processing') renderPhase();
    }
    phase = 'review';
    renderPhase();
  }
  function renderReview(){
    const usable = queue.filter(q=>q.status==='done');
    const failedCount = queue.filter(q=>q.status==='error').length;
    const readyCount = usable.filter(q=>q.category).length;
    overlay.innerHTML = `
      <div class="builder-header"><h3>Set a category for each</h3><button class="btn btn-ghost" id="bulk-close2">✕ Close</button></div>
      <div class="builder-body">
        <div class="builder-main">
          ${failedCount ? `<p class="view-sub" style="margin-bottom:14px; color:var(--danger);">${failedCount} photo${failedCount===1?'':'s'} couldn't be processed and ${failedCount===1?'was':'were'} skipped.</p>` : ''}
          ${usable.length===0 ? `<div class="empty-state"><h3>Nothing to add</h3><p>None of those photos could be processed.</p></div>` : `
            <div style="display:flex; flex-direction:column; gap:16px;">
              ${usable.map((q,idx)=>`
                <div class="bulk-review-row">
                  <div class="bulk-review-photo"><img src="${q.dataUrl}"></div>
                  <div style="flex:1; min-width:0;">
                    <div class="cat-chips">
                      ${CATEGORIES.map(c=>`<div class="chip cat-pick" data-qid="${q.id}" data-cat="${c}" style="${q.category===c?'background:var(--ink); color:var(--bg); border-color:var(--ink);':''}">${CAT_LABEL[c]}</div>`).join('')}
                    </div>
                    <div style="display:flex; align-items:center; gap:8px; margin-top:9px;">
                      <div class="bulk-color-swatch" data-qid="${q.id}" style="background:${q.colorHex||'#ccc'};"></div>
                      <span class="view-sub">${q.category ? `Will be named "${q.colorName} ${CAT_LABEL[q.category]}"` : (q.colorName||'Color') + ' detected — tap a category above'}</span>
                    </div>
                    ${q.pickerOpen ? `<div class="bulk-mini-picker" data-qid="${q.id}">
                      ${COLOR_PRESETS.map(c=>`<div class="color-swatch" data-qid="${q.id}" data-name="${c.name}" data-hex="${c.hex}" style="background:${c.hex};" title="${c.name}"></div>`).join('')}
                    </div>` : ''}
                    ${idx===0 ? `<button class="btn-text" id="bulk-apply-all" style="padding:6px 0 0; font-size:12px;">Use this category for all photos</button>` : ''}
                  </div>
                </div>
              `).join('')}
            </div>
          `}
        </div>
        <div class="builder-cart">
          <h3 style="font-size:16px; margin-bottom:8px;">${readyCount} of ${usable.length} ready</h3>
          <p class="view-sub" style="margin-bottom:14px;">Tap a category chip on each photo. Color is guessed automatically — tap its swatch to change it.</p>
          <div class="cart-actions">
            <button class="btn btn-primary" id="bulk-save-btn" ${(usable.length>0 && readyCount===usable.length)?'':'disabled'}>Add ${usable.length} item${usable.length===1?'':'s'} to closet</button>
          </div>
        </div>
      </div>`;
    overlay.querySelector('#bulk-close2').addEventListener('click', ()=> overlay.remove());
    overlay.querySelectorAll('.cat-pick').forEach(el=> el.addEventListener('click', ()=>{
      const q = queue.find(x=>x.id===el.dataset.qid);
      if(q) q.category = el.dataset.cat;
      renderReview();
    }));
    overlay.querySelectorAll('.bulk-color-swatch').forEach(el=> el.addEventListener('click', ()=>{
      const q = queue.find(x=>x.id===el.dataset.qid);
      if(q){ q.pickerOpen = !q.pickerOpen; renderReview(); }
    }));
    overlay.querySelectorAll('.bulk-mini-picker .color-swatch').forEach(el=> el.addEventListener('click', ()=>{
      const q = queue.find(x=>x.id===el.dataset.qid);
      if(q){ q.colorHex = el.dataset.hex; q.colorName = el.dataset.name; q.pickerOpen = false; renderReview(); }
    }));
    const applyAllBtn = overlay.querySelector('#bulk-apply-all');
    if(applyAllBtn) applyAllBtn.addEventListener('click', ()=>{
      const cat = usable[0].category;
      if(!cat){ toast('Tap a category on the first photo first'); return; }
      usable.forEach(q=> q.category = cat);
      renderReview();
    });
    const saveBtn = overlay.querySelector('#bulk-save-btn');
    if(saveBtn) saveBtn.addEventListener('click', async ()=>{
      saveBtn.disabled = true; saveBtn.textContent = 'Adding…';
      for(const q of usable){
        const item = {
          id: uid(),
          name: `${q.colorName || 'Item'} ${CAT_LABEL[q.category]}`,
          category: q.category,
          color: q.colorName || '',
          colorHex: q.colorHex || null,
          seasons: ['all-season'],
          vibes: [],
          image: q.dataUrl,
          wearCount: 0, lastWorn: null, wearHistory: [], createdAt: Date.now(),
          laundryStatus: 'clean', wearsSinceWash: 0, wearsBeforeWash: LAUNDRY_DEFAULT[q.category] || 0
        };
        state.items.push(item);
        await persistItem(item);
      }
      overlay.remove();
      toast(`Added ${usable.length} item${usable.length===1?'':'s'} to your closet ✓`);
      renderView();
    });
  }
  renderPhase();
}

/* ============== OUTFITS VIEW ============== */
function renderOutfits(root){
  root.innerHTML = `
    <div class="view-header">
      <div><h2>Outfits</h2><div class="view-sub">${state.outfits.length} saved outfit${state.outfits.length===1?'':'s'}</div></div>
      <button class="btn btn-primary" id="add-outfit-btn">${ICONS.plus}Create outfit</button>
    </div>
    ${ state.outfits.length===0 ? `<div class="empty-state"><h3>No outfits yet</h3><p>Combine items from your closet into an outfit you can quickly log as worn.</p>
        <button class="btn btn-primary" onclick="document.getElementById('add-outfit-btn').click()">${ICONS.plus} Create outfit</button></div>`
      : `<div class="grid">${state.outfits.map(outfitCard).join('')}</div>` }
  `;
  root.querySelector('#add-outfit-btn').addEventListener('click', ()=> openOutfitBuilder({mode:'outfit'}));
  root.querySelectorAll('.tag-card[data-outfit]').forEach(el=> el.addEventListener('click', ()=> {
    const outfit = state.outfits.find(o=>o.id===el.dataset.outfit);
    openOutfitBuilder({mode:'outfit', existingOutfit:outfit});
  }));
}
function outfitItems(outfit){ return outfit.itemIds.map(id=> state.items.find(i=>i.id===id)).filter(Boolean); }
function outfitCard(outfit){
  const items = outfitItems(outfit).slice(0,4);
  return `<div class="tag-card" data-outfit="${outfit.id}">
    <div class="tag-hole"></div>
    ${outfit.wearCount>0?`<div class="tag-badge">×${outfit.wearCount}</div>`:''}
    <div class="tag-photo"><div class="collage ${items.length<=1?'single':''}">
      ${items.length? items.map(i=>`<img src="${i.image||''}" onerror="this.style.display='none'">`).join('') : `<span class="ph-icon">🧥</span>`}
    </div></div>
    <div class="tag-name">${escapeHtml(outfit.name)}</div>
    <div class="tag-meta mono">${items.length} piece${items.length===1?'':'s'}</div>
  </div>`;
}
/* ---- Outfit builder: scroll-and-tap "cart" style ---- */
function openOutfitBuilder(opts){
  opts = opts || {mode:'outfit'};
  const mode = opts.mode;
  const existing = opts.existingOutfit || null;
  const draft = { itemIds: existing ? [...existing.itemIds] : [], name: existing ? existing.name : '' };
  const filters = { cat:'all', occasion:'all', season:'all', q:'', hideLaundry:true };

  const overlay = document.createElement('div');
  overlay.className = 'builder-overlay';
  document.body.appendChild(overlay);

  function filteredItems(){
    return state.items.filter(i=>{
      if(filters.hideLaundry && i.laundryStatus==='dirty') return false;
      if(filters.cat!=='all' && i.category!==filters.cat) return false;
      if(filters.occasion!=='all' && !occasionMatch(i, filters.occasion)) return false;
      if(filters.season!=='all' && !(i.seasons||[]).includes(filters.season)) return false;
      if(filters.q && !(i.name.toLowerCase().includes(filters.q.toLowerCase()) || (i.color||'').toLowerCase().includes(filters.q.toLowerCase()))) return false;
      return true;
    });
  }
  function selectedItems(){ return draft.itemIds.map(id=>state.items.find(i=>i.id===id)).filter(Boolean); }

  function renderAll(){
    const items = filteredItems();
    const sel = selectedItems();
    const occForScore = filters.occasion!=='all' ? filters.occasion : null;
    const score = comboScoreOutOf10(sel, occForScore);
    const reason = comboReason(sel, occForScore);
    overlay.innerHTML = `
      <div class="builder-header">
        <h3>${mode==='today' ? "Build today's outfit" : (existing?'Edit outfit':'Build an outfit')}</h3>
        <button class="btn btn-ghost" id="builder-close">✕ Close</button>
      </div>
      <div class="builder-body">
        <div class="builder-main">
          <div class="builder-filterbar">
            <div class="chip ${filters.cat==='all'?'active':''}" data-f="cat" data-v="all">All</div>
            ${CATEGORIES.map(c=>`<div class="chip ${filters.cat===c?'active':''}" data-f="cat" data-v="${c}">${CAT_LABEL[c]}</div>`).join('')}
          </div>
          <div class="builder-filterbar">
            <div class="chip ${filters.occasion==='all'?'active':''}" data-f="occasion" data-v="all">Any occasion</div>
            ${VIBES.map(v=>`<div class="chip ${filters.occasion===v?'active':''}" data-f="occasion" data-v="${v}">${VIBE_LABEL[v]}</div>`).join('')}
          </div>
          <div class="builder-filterbar">
            <select id="builder-season"><option value="all">Any season</option>${SEASONS.map(s=>`<option value="${s}" ${filters.season===s?'selected':''}>${s[0].toUpperCase()+s.slice(1)}</option>`).join('')}</select>
            <input class="search-input" id="builder-search" placeholder="Search…" value="${escapeHtml(filters.q)}">
            <label style="display:flex; align-items:center; gap:6px; font-size:13px; color:var(--ink-muted);">
              <input type="checkbox" id="builder-hidelaundry" ${filters.hideLaundry?'checked':''}> Hide items needing wash
            </label>
          </div>
          ${items.length===0 ? `<div class="empty-state"><h3>No items match</h3><p>Try adjusting filters, or add more to your closet.</p></div>` : `
          <div class="builder-grid">
            ${items.map(i=>`<div class="builder-tile ${draft.itemIds.includes(i.id)?'selected':''}" data-pick="${i.id}">
              ${i.image?`<img src="${i.image}">`:''}
              ${i.laundryStatus==='dirty'?'<div class="laundry-flag">WASH</div>':''}
              ${draft.itemIds.includes(i.id)?'<div class="check">✓</div>':''}
            </div>`).join('')}
          </div>`}
        </div>
        <div class="builder-cart">
          <h3 style="font-size:17px; margin-bottom:10px;">Your picks (${sel.length})</h3>
          ${sel.length ? `<div class="cart-items">${sel.map(i=>`<div class="cart-item" data-remove="${i.id}">${i.image?`<img src="${i.image}">`:''}<div class="remove">✕</div></div>`).join('')}</div>` : `<div class="view-sub" style="margin-bottom:12px;">Tap photos on the left to add them here.</div>`}
          <div class="score-badge"><span class="num">${sel.length?score:'—'}</span>/10 · ${reason}</div>
          ${mode==='outfit' ? `<div class="field"><label>Outfit name</label><input type="text" id="builder-name" placeholder="e.g. Rainy Tuesday" value="${escapeHtml(draft.name)}"></div>` : ''}
          <div class="cart-actions">
            ${mode==='today'
              ? `<button class="btn btn-primary" id="builder-wear-now" ${sel.length===0?'disabled':''}>✓ Wear this now</button>`
              : `<button class="btn btn-primary" id="builder-save" ${sel.length===0?'disabled':''}>Save outfit</button>
                 ${existing?`<button class="btn btn-ghost" id="builder-wear-outfit-now">✓ Wear this outfit today</button>`:''}`
            }
            ${existing?`<button class="btn-danger" id="builder-delete">Delete outfit</button>`:''}
          </div>
        </div>
      </div>
    `;
    bindEvents();
  }
  function bindEvents(){
    overlay.querySelector('#builder-close').addEventListener('click', ()=> overlay.remove());
    overlay.querySelectorAll('.chip[data-f]').forEach(el=> el.addEventListener('click', ()=>{
      filters[el.dataset.f] = el.dataset.v; renderAll();
    }));
    const seasonSel = overlay.querySelector('#builder-season');
    if(seasonSel) seasonSel.addEventListener('change', e=>{ filters.season = e.target.value; renderAll(); });
    const searchInp = overlay.querySelector('#builder-search');
    if(searchInp) searchInp.addEventListener('input', e=>{
      filters.q = e.target.value; renderAll();
      const ni = overlay.querySelector('#builder-search');
      if(ni){ ni.focus(); ni.setSelectionRange(ni.value.length, ni.value.length); }
    });
    const hideCb = overlay.querySelector('#builder-hidelaundry');
    if(hideCb) hideCb.addEventListener('change', e=>{ filters.hideLaundry = e.target.checked; renderAll(); });
    overlay.querySelectorAll('.builder-tile[data-pick]').forEach(el=> el.addEventListener('click', ()=>{
      const id = el.dataset.pick;
      if(draft.itemIds.includes(id)) draft.itemIds = draft.itemIds.filter(x=>x!==id);
      else draft.itemIds.push(id);
      renderAll();
    }));
    overlay.querySelectorAll('.cart-item[data-remove]').forEach(el=> el.addEventListener('click', ()=>{
      draft.itemIds = draft.itemIds.filter(x=>x!==el.dataset.remove);
      renderAll();
    }));
    const nameInp = overlay.querySelector('#builder-name');
    if(nameInp) nameInp.addEventListener('input', e=>{ draft.name = e.target.value; });
    const saveBtn = overlay.querySelector('#builder-save');
    if(saveBtn) saveBtn.addEventListener('click', async ()=>{
      const nameVal = (overlay.querySelector('#builder-name')?.value || '').trim();
      if(!nameVal){ toast('Give this outfit a name'); return; }
      if(draft.itemIds.length===0){ toast('Pick at least one item'); return; }
      const outfitObj = existing
        ? {...existing, name:nameVal, itemIds:[...draft.itemIds]}
        : { id:uid(), name:nameVal, itemIds:[...draft.itemIds], wearCount:0, lastWorn:null, createdAt:Date.now() };
      if(existing){ const idx = state.outfits.findIndex(o=>o.id===existing.id); state.outfits[idx]=outfitObj; }
      else state.outfits.push(outfitObj);
      await persistOutfit(outfitObj);
      overlay.remove(); toast(existing?'Outfit updated':'Outfit saved'); renderView();
    });
    const wearNowBtn = overlay.querySelector('#builder-wear-now');
    if(wearNowBtn) wearNowBtn.addEventListener('click', async ()=>{
      const t = todayStr();
      for(const item of selectedItems()){ applyWear(item, t); await persistItem(item); }
      state.todayWornLog = t; state.todaySuggestion = selectedItems();
      overlay.remove(); toast('Logged as worn today ✓'); renderView();
    });
    const wearOutfitBtn = overlay.querySelector('#builder-wear-outfit-now');
    if(wearOutfitBtn) wearOutfitBtn.addEventListener('click', async ()=>{
      const t = todayStr();
      for(const item of selectedItems()){ applyWear(item, t); await persistItem(item); }
      existing.wearCount = (existing.wearCount||0)+1; existing.lastWorn = t;
      await persistOutfit(existing);
      overlay.remove(); toast('Outfit logged as worn ✓'); renderView();
    });
    const delBtn = overlay.querySelector('#builder-delete');
    if(delBtn) delBtn.addEventListener('click', async ()=>{
      if(!confirm('Delete this outfit?')) return;
      state.outfits = state.outfits.filter(o=>o.id!==existing.id);
      await deleteOutfitStorage(existing.id);
      overlay.remove(); toast('Outfit deleted'); renderView();
    });
  }
  renderAll();
}

/* ============== TODAY VIEW ============== */
function generateSuggestion(occasion, includeLaundry){
  const pool = state.items.filter(i=> includeLaundry || i.laundryStatus!=='dirty');
  const byCat = {};
  CATEGORIES.forEach(c=> byCat[c] = pool.filter(i=>i.category===c));
  function candidatesFor(cat){
    const all = byCat[cat];
    if(!occasion) return all;
    const matched = all.filter(i=>occasionMatch(i, occasion));
    return matched.length ? matched : all;
  }
  function pickFirst(arr){
    if(arr.length===0) return null;
    const sorted = arr.slice().sort((a,b)=> (a.wearCount||0)-(b.wearCount||0));
    const minWear = sorted[0].wearCount||0;
    const pool2 = sorted.filter(x=> (x.wearCount||0)===minWear);
    return pool2[Math.floor(Math.random()*pool2.length)];
  }
  function pickBest(arr, chosen){
    if(arr.length===0) return null;
    let best=null, bestScore=-Infinity;
    const shuffled = arr.slice().sort(()=>Math.random()-0.5);
    for(const cand of shuffled){
      const colorScore = comboColorScore([...chosen, cand]);
      const wearPenalty = (cand.wearCount||0)*0.05;
      const jitter = Math.random()*0.2;
      const s = colorScore - wearPenalty + jitter;
      if(s>bestScore){ bestScore=s; best=cand; }
    }
    return best;
  }
  const picks = [];
  const dressCandidates = candidatesFor('dress');
  const useDress = dressCandidates.length>0 && Math.random() < 0.4;
  if(useDress){
    picks.push(pickFirst(dressCandidates));
  } else {
    const top = pickFirst(candidatesFor('top')); if(top) picks.push(top);
    const bottom = pickBest(candidatesFor('bottom'), picks); if(bottom) picks.push(bottom);
  }
  const shoes = pickBest(candidatesFor('shoes'), picks); if(shoes) picks.push(shoes);
  if(candidatesFor('outerwear').length>0 && Math.random()<0.5){ const o=pickBest(candidatesFor('outerwear'), picks); if(o) picks.push(o); }
  if(candidatesFor('accessory').length>0 && Math.random()<0.5){ const a=pickBest(candidatesFor('accessory'), picks); if(a) picks.push(a); }
  return picks.filter(Boolean);
}
// Renders a suggested/selected outfit as one continuous "flat lay" frame —
// pieces are absolutely positioned so they overlap like actually-worn garments,
// on one shared stage, instead of sitting in separate cards.
function renderOutfitDisplay(items){
  const dress = items.find(i=>i.category==='dress');
  const top = items.find(i=>i.category==='top');
  const bottom = items.find(i=>i.category==='bottom');
  const shoes = items.find(i=>i.category==='shoes');
  const outerwear = items.find(i=>i.category==='outerwear');
  const accessory = items.find(i=>i.category==='accessory');

  const layers = [];
  if(dress){
    layers.push({item:dress, style:'top:2%; left:18%; width:64%; height:66%; z-index:2;'});
    if(shoes) layers.push({item:shoes, style:'top:65%; left:30%; width:42%; height:22%; z-index:3;'});
  } else {
    if(top) layers.push({item:top, style:'top:0%; left:20%; width:60%; height:42%; z-index:2;'});
    if(bottom) layers.push({item:bottom, style:'top:19%; left:22%; width:56%; height:57%; z-index:1;'});
    if(shoes) layers.push({item:shoes, style:'top:73%; left:30%; width:42%; height:20%; z-index:3;'});
  }
  if(outerwear) layers.push({item:outerwear, style:'top:-2%; left:0%; width:50%; height:48%; z-index:4;'});
  if(accessory) layers.push({item:accessory, style:'top:0%; left:72%; width:24%; height:24%; z-index:5;'});

  const caption = layers.map(l=>`${CAT_LABEL[l.item.category]}: ${escapeHtml(l.item.name)}`).join(' &nbsp;·&nbsp; ');
  return `<div class="outfit-stage">
    ${layers.map(l=>`<div class="stage-item" style="${l.style}">${l.item.image?`<img src="${l.item.image}">`:`<span class="ph-icon">👕</span>`}</div>`).join('')}
  </div>
  <div class="outfit-caption">${caption}</div>`;
}
function renderToday(root){
  const occ = state.todayOccasion==='all' ? null : state.todayOccasion;
  if(!state.todaySuggestion) state.todaySuggestion = generateSuggestion(occ, state.todayIncludeLaundry);
  const items = state.todaySuggestion;
  const score = comboScoreOutOf10(items, occ);
  const reason = comboReason(items, occ);
  const wornToday = state.todayWornLog===todayStr();
  root.innerHTML = `
    <div class="view-header" style="margin-bottom:12px;"><div><h2 style="font-size:23px;">Today</h2><div class="view-sub">${new Date().toLocaleDateString('en-US',{weekday:'long', month:'long', day:'numeric'})}</div></div></div>
    ${wornToday? `<div class="worn-banner">✓ Logged as worn today</div>` : ''}
    <div class="filter-bar" style="margin-bottom:8px;">
      <div class="chip ${state.todayOccasion==='all'?'active':''}" data-occ="all">Any occasion</div>
      ${VIBES.map(v=>`<div class="chip ${state.todayOccasion===v?'active':''}" data-occ="${v}">${VIBE_LABEL[v]}</div>`).join('')}
    </div>
    <label style="display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink-muted); margin-bottom:10px;">
      <input type="checkbox" id="today-hidelaundry" ${state.todayIncludeLaundry?'checked':''}> Include items that need washing
    </label>
    <div class="today-card">
      <div class="today-date mono">SUGGESTED PICK</div>
      <h3 style="font-size:17px;">${items.length? 'A good option for today' : 'Add some items first'}</h3>
      ${items.length===0 ? `<p class="view-sub">Your closet needs at least a top/bottom or dress and shoes before Hang can suggest an outfit.</p>` : `
        ${renderOutfitDisplay(items)}
        <div class="score-badge" style="max-width:340px; margin:0 auto 4px;"><span class="num">${score}</span>/10 · ${reason}</div>
        <div class="today-actions" style="justify-content:center;">
          <button class="btn btn-primary" id="wear-today-btn">✓ Wear this today</button>
          <button class="btn btn-ghost" id="shuffle-btn">🔀 Shuffle</button>
        </div>
      `}
      <div style="margin-top:8px; text-align:center;"><button class="btn btn-text" id="build-own-btn">🧵 Build your own instead</button></div>
    </div>
  `;
  root.querySelectorAll('.chip[data-occ]').forEach(el=> el.addEventListener('click', ()=>{
    state.todayOccasion = el.dataset.occ;
    state.todaySuggestion = generateSuggestion(state.todayOccasion==='all'?null:state.todayOccasion, state.todayIncludeLaundry);
    renderView();
  }));
  root.querySelector('#today-hidelaundry').addEventListener('change', e=>{
    state.todayIncludeLaundry = e.target.checked;
    state.todaySuggestion = generateSuggestion(occ, state.todayIncludeLaundry);
    renderView();
  });
  root.querySelector('#build-own-btn').addEventListener('click', ()=> openOutfitBuilder({mode:'today'}));
  const shuffleBtn = root.querySelector('#shuffle-btn');
  if(shuffleBtn) shuffleBtn.addEventListener('click', ()=>{ state.todaySuggestion = generateSuggestion(occ, state.todayIncludeLaundry); renderView(); });
  const wearBtn = root.querySelector('#wear-today-btn');
  if(wearBtn) wearBtn.addEventListener('click', async ()=>{
    const t = todayStr();
    for(const i of items){
      const idx = state.items.findIndex(x=>x.id===i.id);
      applyWear(state.items[idx], t);
      await persistItem(state.items[idx]);
    }
    state.todayWornLog = t;
    toast('Logged as worn today ✓');
    renderView();
  });
}

/* ============== STATS VIEW ============== */
function renderStats(root){
  const items = state.items;
  const totalWears = items.reduce((s,i)=> s+(i.wearCount||0), 0);
  const mostWorn = items.slice().sort((a,b)=>(b.wearCount||0)-(a.wearCount||0)).slice(0,5);
  const neverWorn = items.filter(i=>!i.wearCount);
  const dirtyItems = items.filter(i=>i.laundryStatus==='dirty');
  const byCat = {};
  CATEGORIES.forEach(c=> byCat[c] = items.filter(i=>i.category===c).length);
  const maxCat = Math.max(1, ...Object.values(byCat));
  root.innerHTML = `
    <div class="view-header"><h2>Stats</h2></div>
    <div class="stat-grid">
      <div class="stat-box"><div class="num mono">${items.length}</div><div class="label">Items in closet</div></div>
      <div class="stat-box"><div class="num mono">${state.outfits.length}</div><div class="label">Saved outfits</div></div>
      <div class="stat-box"><div class="num mono">${totalWears}</div><div class="label">Total wears logged</div></div>
      <div class="stat-box"><div class="num mono">${neverWorn.length}</div><div class="label">Never worn yet</div></div>
      <div class="stat-box"><div class="num mono" style="color:${dirtyItems.length?'var(--danger)':'var(--rust)'}">${dirtyItems.length}</div><div class="label">Needs washing</div></div>
    </div>
    <h3 style="margin-bottom:12px; font-size:17px;">Closet breakdown</h3>
    <div style="margin-bottom:28px;">
      ${CATEGORIES.map(c=>`<div class="bar-row">
        <div class="bar-label">${CAT_LABEL[c]}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${(byCat[c]/maxCat)*100}%"></div></div>
        <div class="bar-val mono">${byCat[c]}</div>
      </div>`).join('')}
    </div>
    <h3 style="margin-bottom:8px; font-size:17px;">Most worn</h3>
    <div class="stat-box" style="margin-bottom:20px;">
      ${mostWorn.length===0? `<div class="view-sub">Log a few outfits and this will fill in.</div>` :
        mostWorn.map(i=>`<div class="stat-list-row">
          <div class="tag-photo">${i.image?`<img src="${i.image}">`:''}</div>
          <div><div class="stat-list-name">${escapeHtml(i.name)}</div><div class="stat-list-sub mono">Worn ${i.wearCount||0}× · Last ${fmtDate(i.lastWorn)}</div></div>
        </div>`).join('')}
    </div>
    <h3 style="margin-bottom:8px; font-size:17px;">Needs some love</h3>
    <div class="stat-box">
      ${neverWorn.length===0? `<div class="view-sub">Everything in your closet has been worn at least once.</div>` :
        neverWorn.slice(0,6).map(i=>`<div class="stat-list-row">
          <div class="tag-photo">${i.image?`<img src="${i.image}">`:''}</div>
          <div><div class="stat-list-name">${escapeHtml(i.name)}</div><div class="stat-list-sub mono">Never worn</div></div>
        </div>`).join('')}
    </div>
  `;
}

/* ============== INIT ============== */
render();
if(!CONFIG_MISSING){
  onAuthStateChanged(auth, (user)=>{
    state.user = user;
    if(user){
      state.loaded = false;
      render();
      loadAll();
    } else {
      state.items = []; state.outfits = []; state.loaded = false;
      render();
    }
  });
}
</script>
