<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hang — Wardrobe Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5EEE1;
    --surface:#FFFBF3;
    --surface-2:#EFE4D2;
    --ink:#33271C;
    --ink-muted:#8A7A67;
    --rust:#B54E2B;
    --rust-soft:#E7C7AE;
    --sage:#707A57;
    --sage-soft:#DCE2CC;
    --line:#DDCBAE;
    --danger:#9C3B2E;
    --shadow: 0 2px 10px rgba(51,39,28,0.08), 0 1px 2px rgba(51,39,28,0.06);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{ font-family:'Fraunces',serif; font-weight:600; margin:0; letter-spacing:-0.01em;}
  .mono{ font-family:'IBM Plex Mono',monospace; letter-spacing:0.02em; }
  button{ font-family:'Inter',sans-serif; cursor:pointer; }
  a{ color:inherit; }

  /* ---------- Layout shell ---------- */
  #app{ display:flex; min-height:100vh; }
  .sidebar{
    width:220px; flex-shrink:0; background:var(--surface);
    border-right:1px solid var(--line); padding:28px 18px;
    display:flex; flex-direction:column; gap:6px;
  }
  .brand{ display:flex; align-items:center; gap:10px; padding:0 10px 24px; }
  .brand .mark{ font-size:26px; }
  .brand h1{ font-size:22px; color:var(--rust); }
  .nav-item{
    display:flex; align-items:center; gap:12px; padding:11px 14px; border-radius:10px;
    color:var(--ink-muted); font-weight:600; font-size:14.5px; background:none; border:none;
    text-align:left; width:100%;
  }
  .nav-item svg{ width:18px; height:18px; flex-shrink:0; }
  .nav-item.active{ background:var(--rust-soft); color:var(--rust); }
  .nav-item:hover:not(.active){ background:var(--surface-2); }
  .sidebar-foot{ margin-top:auto; padding:10px; font-size:12px; color:var(--ink-muted); }

  main{ flex:1; min-width:0; padding:32px 40px 100px; max-width:1100px; }
  .topbar-mobile{ display:none; }
  .view-header{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:22px; gap:12px; flex-wrap:wrap;}
  .view-header h2{ font-size:28px; }
  .view-sub{ color:var(--ink-muted); font-size:13.5px; margin-top:4px; }

  .btn{
    border-radius:10px; border:none; padding:10px 16px; font-weight:600; font-size:14px;
    display:inline-flex; align-items:center; gap:6px;
  }
  .btn-primary{ background:var(--rust); color:#fff; }
  .btn-primary:hover{ background:#9c4324; }
  .btn-ghost{ background:var(--surface-2); color:var(--ink); }
  .btn-ghost:hover{ background:var(--line); }
  .btn-text{ background:none; color:var(--ink-muted); padding:8px 10px; }
  .btn-danger{ background:none; color:var(--danger); font-weight:600; }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }

  /* ---------- Filter bar ---------- */
  .filter-bar{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px; align-items:center; }
  .chip{
    border:1px solid var(--line); background:var(--surface); color:var(--ink-muted);
    border-radius:20px; padding:6px 13px; font-size:13px; font-weight:600;
  }
  .chip.active{ background:var(--ink); color:var(--bg); border-color:var(--ink); }
  .search-input, select, input[type=text]{
    border:1px solid var(--line); background:var(--surface); border-radius:9px;
    padding:9px 12px; font-size:13.5px; color:var(--ink); font-family:'Inter',sans-serif;
  }
  .search-input{ min-width:180px; }

  /* ---------- Tag card (signature element) ---------- */
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:18px; }
  .tag-card{
    position:relative; background:var(--surface); border:1px dashed var(--line);
    border-radius:14px; padding:12px; cursor:pointer; transition:transform .15s, box-shadow .15s;
  }
  .tag-card:hover{ transform:translateY(-2px); box-shadow:var(--shadow); }
  .tag-hole{
    position:absolute; top:10px; left:10px; width:14px; height:14px; border-radius:50%;
    background:var(--bg); border:1px dashed var(--line); z-index:2;
  }
  .tag-photo{
    width:100%; aspect-ratio:1/1; border-radius:9px; background:var(--surface-2);
    overflow:hidden; display:flex; align-items:center; justify-content:center;
    margin-bottom:10px; position:relative;
  }
  .tag-photo img{ width:100%; height:100%; object-fit:contain; }
  .tag-photo .ph-icon{ font-size:30px; opacity:.35; }
  .tag-name{ font-weight:600; font-size:14px; margin-bottom:3px; }
  .tag-meta{ font-size:11px; color:var(--ink-muted); }
  .tag-badge{
    position:absolute; top:8px; right:8px; background:var(--sage-soft); color:var(--sage);
    font-size:10.5px; font-weight:700; padding:3px 7px; border-radius:6px; z-index:2;
  }
  .collage{ display:grid; grid-template-columns:1fr 1fr; gap:3px; }
  .collage img{ width:100%; height:100%; object-fit:contain; }
  .collage.single{ grid-template-columns:1fr; }

  .empty-state{
    border:1px dashed var(--line); border-radius:16px; padding:48px 24px; text-align:center;
    color:var(--ink-muted); background:var(--surface);
  }
  .empty-state h3{ color:var(--ink); font-size:18px; margin-bottom:8px; }
  .empty-state p{ font-size:13.5px; margin:0 0 16px; }

  /* ---------- Today view ---------- */
  .today-card{
    background:var(--surface); border-radius:20px; border:1px solid var(--line);
    padding:20px 22px; max-width:640px;
  }
  .today-date{ font-size:12px; color:var(--ink-muted); margin-bottom:2px; }
  .today-actions{ display:flex; gap:10px; margin-top:12px; }
  .worn-banner{
    background:var(--sage-soft); color:var(--sage); border-radius:12px; padding:10px 14px;
    font-weight:600; font-size:13.5px; margin-bottom:12px;
  }
  /* Overlapping "flat lay" stage — pieces are absolutely positioned so they
     genuinely overlap like worn garments, on one shared background. Works best
     with background-removed photos, which keep real transparency. */
  .outfit-stage{ position:relative; width:100%; max-width:280px; height:300px; margin:8px auto 6px; }
  .stage-item{ position:absolute; }
  .stage-item img{ width:100%; height:100%; object-fit:contain; display:block; }
  .stage-item .ph-icon{ display:flex; align-items:center; justify-content:center; width:100%; height:100%; font-size:26px; opacity:.3; }
  .outfit-caption{ font-size:11.5px; color:var(--ink-muted); text-align:center; line-height:1.5; margin-bottom:4px; }

  /* ---------- Stats ---------- */
  .stat-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; margin-bottom:28px; }
  .stat-box{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:18px; }
  .stat-box .num{ font-family:'Fraunces',serif; font-size:30px; color:var(--rust); }
  .stat-box .label{ font-size:12px; color:var(--ink-muted); font-weight:600; margin-top:2px; }
  .bar-row{ display:flex; align-items:center; gap:10px; margin-bottom:9px; }
  .bar-label{ width:90px; font-size:12.5px; color:var(--ink-muted); flex-shrink:0; }
  .bar-track{ flex:1; height:9px; background:var(--surface-2); border-radius:6px; overflow:hidden; }
  .bar-fill{ height:100%; background:var(--rust); border-radius:6px; }
  .bar-val{ font-size:12px; width:26px; text-align:right; color:var(--ink-muted); }
  .stat-list-row{ display:flex; align-items:center; gap:12px; padding:8px 0; border-bottom:1px solid var(--line); }
  .stat-list-row:last-child{ border-bottom:none; }
  .stat-list-row .tag-photo{ width:40px; height:40px; margin:0; flex-shrink:0; }
  .stat-list-name{ font-weight:600; font-size:13.5px; }
  .stat-list-sub{ font-size:11.5px; color:var(--ink-muted); }

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(51,39,28,0.45); display:flex; align-items:flex-start;
    justify-content:center; padding:30px 16px; overflow-y:auto; z-index:100;
  }
  .modal{
    background:var(--surface); border-radius:18px; padding:26px; width:100%; max-width:460px;
    margin:auto;
  }
  .modal h3{ font-size:20px; margin-bottom:16px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12.5px; font-weight:700; color:var(--ink-muted); margin-bottom:6px; }
  .field input, .field select{ width:100%; }
  .season-chips, .cat-chips{ display:flex; gap:7px; flex-wrap:wrap; }
  .photo-upload{
    border:1px dashed var(--line); border-radius:12px; height:150px; display:flex;
    align-items:center; justify-content:center; flex-direction:column; gap:6px; cursor:pointer;
    background:var(--surface-2); overflow:hidden; position:relative; margin-bottom:14px;
  }
  .photo-upload img{ width:100%; height:100%; object-fit:contain; position:absolute; }
  .photo-upload .hint{ font-size:12px; color:var(--ink-muted); text-align:center; padding:0 20px;}
  .modal-actions{ display:flex; justify-content:space-between; align-items:center; margin-top:18px; gap:10px; }
  .item-pick-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; max-height:220px; overflow-y:auto; margin-bottom:6px; }
  .pick-tile{ position:relative; border-radius:9px; overflow:hidden; aspect-ratio:1/1; border:2px solid transparent; background:var(--surface-2); cursor:pointer; }
  .pick-tile img{ width:100%; height:100%; object-fit:contain; }
  .pick-tile.selected{ border-color:var(--rust); }
  .pick-tile .check{ position:absolute; top:4px; right:4px; width:18px; height:18px; border-radius:50%; background:var(--rust); color:#fff; font-size:11px; display:flex; align-items:center; justify-content:center; }
  .pick-cat-label{ font-size:11px; font-weight:700; color:var(--ink-muted); margin:12px 0 6px; text-transform:uppercase; letter-spacing:.04em; }

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--bg);
    padding:12px 20px; border-radius:10px; font-size:13.5px; font-weight:600; z-index:200; box-shadow:var(--shadow);
  }

  /* ---------- Outfit builder (cart-style) ---------- */
  .builder-overlay{ position:fixed; inset:0; background:var(--bg); z-index:150; display:flex; flex-direction:column; }
  .builder-header{ display:flex; justify-content:space-between; align-items:center; padding:16px 20px; border-bottom:1px solid var(--line); background:var(--surface); flex-shrink:0; }
  .builder-body{ flex:1; display:flex; overflow:hidden; }
  .builder-main{ flex:1; overflow-y:auto; padding:18px 22px; }
  .builder-filterbar{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; align-items:center; }
  .builder-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:10px; margin-top:8px; }
  .builder-tile{ position:relative; border-radius:10px; overflow:hidden; aspect-ratio:1/1; border:2px solid transparent; background:var(--surface-2); cursor:pointer; }
  .builder-tile img{ width:100%; height:100%; object-fit:contain; }
  .builder-tile.selected{ border-color:var(--rust); }
  .builder-tile .check{ position:absolute; top:5px; right:5px; width:20px; height:20px; border-radius:50%; background:var(--rust); color:#fff; font-size:12px; display:flex; align-items:center; justify-content:center; }
  .builder-tile .laundry-flag{ position:absolute; top:5px; left:5px; background:var(--danger); color:#fff; font-size:9px; font-weight:700; padding:2px 5px; border-radius:5px; letter-spacing:.03em; }
  .builder-cart{ width:300px; flex-shrink:0; background:var(--surface); border-left:1px solid var(--line); padding:18px; overflow-y:auto; display:flex; flex-direction:column; }
  .cart-items{ display:flex; flex-wrap:wrap; gap:8px; margin:10px 0; }
  .cart-item{ position:relative; width:56px; height:56px; border-radius:8px; overflow:hidden; background:var(--surface-2); }
  .cart-item img{ width:100%; height:100%; object-fit:contain; }
  .cart-item .remove{ position:absolute; top:-5px; right:-5px; width:18px; height:18px; border-radius:50%; background:var(--danger); color:#fff; font-size:11px; display:flex; align-items:center; justify-content:center; border:2px solid var(--surface); cursor:pointer; }
  .score-badge{ background:var(--sage-soft); color:var(--sage); border-radius:10px; padding:10px 12px; font-size:12.5px; font-weight:600; margin-bottom:14px; line-height:1.4; }
  .score-badge .num{ font-family:'Fraunces',serif; font-size:20px; color:var(--rust); }
  .cart-actions{ display:flex; flex-direction:column; gap:8px; margin-top:auto; padding-top:8px; }
  @media (max-width:820px){
    .builder-body{ flex-direction:column; }
    .builder-cart{ width:100%; border-left:none; border-top:1px solid var(--line); position:fixed; bottom:0; left:0; right:0; max-height:48vh; padding:14px 16px calc(14px + env(safe-area-inset-bottom)); }
    .builder-main{ padding-bottom:220px; }
  }

  /* ---------- Color swatch picker ---------- */
  .color-swatch-grid{ display:flex; flex-wrap:wrap; gap:9px; }
  .color-swatch{
    width:32px; height:32px; border-radius:50%; cursor:pointer; box-shadow:0 0 0 1px var(--line);
    display:flex; align-items:center; justify-content:center; flex-shrink:0; position:relative;
  }
  .color-swatch.selected{ box-shadow:0 0 0 2px var(--surface), 0 0 0 4px var(--rust); }
  .color-swatch.selected::after{ content:'✓'; font-size:13px; color:#fff; text-shadow:0 0 2px rgba(0,0,0,.6); }
  .custom-swatch{ background:linear-gradient(135deg,#e33,#f90,#ec3,#3a7,#39c,#96c); font-size:15px; }
  .color-name-label{ font-size:12.5px; color:var(--ink-muted); margin-top:8px; }
  .color-dot{ display:inline-block; width:10px; height:10px; border-radius:50%; box-shadow:0 0 0 1px var(--line); margin-right:4px; vertical-align:-1px; }

  /* ---------- Photo upload states ---------- */
  .bg-remove-toggle{ display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink-muted); margin-bottom:12px; }
  .photo-processing{ display:flex; flex-direction:column; align-items:center; gap:8px; color:var(--ink-muted); font-size:12.5px; }
  .spinner{ width:22px; height:22px; border-radius:50%; border:2.5px solid var(--line); border-top-color:var(--rust); animation:spin 0.8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .photo-source-buttons{ display:flex; gap:8px; margin-bottom:10px; }
  .photo-source-buttons .btn{ flex:1; justify-content:center; }

  /* ---------- In-app camera capture ---------- */
  .camera-overlay{ position:fixed; inset:0; background:#000; z-index:250; display:flex; flex-direction:column; }
  .camera-video-wrap{ position:relative; flex:1; overflow:hidden; background:#000; }
  .camera-video-wrap video{ width:100%; height:100%; object-fit:cover; display:block; }
  .camera-guide{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; }
  .camera-guide svg{ width:62%; max-width:320px; opacity:0.85; filter:drop-shadow(0 0 3px rgba(0,0,0,.6)); }
  .camera-hint{
    position:absolute; top:16px; left:0; right:0; text-align:center; color:#fff; font-size:13px;
    font-weight:600; text-shadow:0 1px 3px rgba(0,0,0,.6); padding:0 20px;
  }
  .camera-controls{
    background:#000; display:flex; align-items:center; justify-content:space-between;
    padding:18px 26px calc(18px + env(safe-area-inset-bottom));
  }
  .camera-close{ background:none; border:none; color:#fff; font-size:15px; font-weight:600; cursor:pointer; }
  .camera-shutter{
    width:64px; height:64px; border-radius:50%; background:#fff; border:4px solid rgba(255,255,255,.35);
    cursor:pointer; flex-shrink:0;
  }
  .camera-shutter:active{ background:var(--rust-soft); }
  .camera-controls-spacer{ width:60px; }

  /* ---------- Bulk add review ---------- */
  .bulk-review-row{ display:flex; gap:14px; align-items:flex-start; padding-bottom:16px; border-bottom:1px dashed var(--line); }
  .bulk-review-photo{ width:88px; height:88px; flex-shrink:0; border-radius:12px; background:var(--surface-2); overflow:hidden; display:flex; align-items:center; justify-content:center; }
  .bulk-review-photo img{ width:100%; height:100%; object-fit:contain; }
  .bulk-color-swatch{ width:24px; height:24px; border-radius:50%; box-shadow:0 0 0 1px var(--line); cursor:pointer; flex-shrink:0; }
  .bulk-mini-picker{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; padding:10px; background:var(--surface-2); border-radius:10px; }
  .bulk-mini-picker .color-swatch{ width:24px; height:24px; }

  /* ---------- Mobile ---------- */
  .bottom-nav{ display:none; }
  @media (max-width:820px){
    .sidebar{ display:none; }
    #app{ flex-direction:column; }
    main{ padding:20px 16px 90px; max-width:100%; }
    .topbar-mobile{
      display:flex; align-items:center; justify-content:space-between; padding:6px 2px 18px;
    }
    .topbar-mobile .brand{ padding:0; }
    .bottom-nav{
      display:flex; position:fixed; bottom:0; left:0; right:0; background:var(--surface);
      border-top:1px solid var(--line); z-index:50; padding:6px 4px calc(6px + env(safe-area-inset-bottom));
    }
    .bottom-nav .nav-item{ flex:1; flex-direction:column; align-items:center; gap:3px; font-size:10.5px; padding:6px 2px; border-radius:10px; }
    .bottom-nav .nav-item.active{ background:none; color:var(--rust); }
    .grid{ grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:12px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast-root"></div>

<script src="config.js"></script>
<script type="module">
/* ============== FIREBASE SETUP ============== */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, doc, getDocs, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const FIREBASE_CONFIG = window.HANG_FIREBASE_CONFIG || null;
const CONFIG_MISSING = !FIREBASE_CONFIG || !FIREBASE_CONFIG.apiKey || FIREBASE_CONFIG.apiKey.includes('PASTE');
let db = null, auth = null;
if(!CONFIG_MISSING){
  const fbApp = initializeApp(FIREBASE_CONFIG);
  db = getFirestore(fbApp);
  auth = getAuth(fbApp);
}
function friendlyAuthError(e){
  const code = e && e.code || '';
  if(code.includes('email-already-in-use')) return 'An account with that email already exists — try signing in instead.';
  if(code.includes('invalid-email')) return 'That email address doesn\'t look right.';
  if(code.includes('weak-password')) return 'Password should be at least 6 characters.';
  if(code.includes('wrong-password') || code.includes('invalid-credential')) return 'Incorrect email or password.';
  if(code.includes('user-not-found')) return 'No account found with that email — try creating one instead.';
  if(code.includes('too-many-requests')) return 'Too many attempts — please wait a bit and try again.';
  return 'Something went wrong. Please try again.';
}
async function doSignUp(email, password){
  try{ state.authError = null; await createUserWithEmailAndPassword(auth, email, password); }
  catch(e){ state.authError = friendlyAuthError(e); render(); }
}
async function doSignIn(email, password){
  try{ state.authError = null; await signInWithEmailAndPassword(auth, email, password); }
  catch(e){ state.authError = friendlyAuthError(e); render(); }
}
async function doLogout(){ try{ await signOut(auth); }catch(e){ console.error(e); } }

/* ============== ICONS ============== */
const ICONS = {
  closet: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l7 4v1H5V7l7-4z"/><path d="M5 8v13M19 8v13M12 8v13"/><path d="M3 21h18"/></svg>`,
  outfits: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7l4-3 4 3-1 3H5l-1-3z"/><path d="M9 7v13M4 10l1 10M14 10l-1 10"/><path d="M14 7l4-3 4 3-1 3h-6l-1-3z"/></svg>`,
  today: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M4.2 4.2l2 2M17.8 17.8l2 2M2 12h3M19 12h3M4.2 19.8l2-2M17.8 6.2l2-2"/></svg>`,
  stats: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10M12 20V4M20 20v-7"/><path d="M2 20h20"/></svg>`,
  plus: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>`,
};

/* ============== STATE ============== */
const state = { view:'closet', items:[], outfits:[], loaded:false,
  filters:{cat:'all', q:'', sort:'recent', laundry:false},
  todaySuggestion:null, todayWornLog:null, todayOccasion:'all', todayIncludeLaundry:false,
  user:null, authMode:'signin', authError:null, authBusy:false };

const CATEGORIES = ['top','bottom','dress','outerwear','shoes','accessory'];
const CAT_LABEL = {top:'Top',bottom:'Bottom',dress:'Dress',outerwear:'Outerwear',shoes:'Shoes',accessory:'Accessory'};
const SEASONS = ['spring','summer','fall','winter','all-season'];
const VIBES = ['casual','work','date','formal','workout','rainy'];
const VIBE_LABEL = {casual:'Casual',work:'Work',date:'Date Night',formal:'Formal',workout:'Workout',rainy:'Rainy Day'};
// Smart default "wears before wash" per category. 0 = not auto-tracked (manual toggle only).
const LAUNDRY_DEFAULT = {top:1, bottom:3, dress:1, outerwear:8, shoes:0, accessory:0};

// Preset color swatches shown in the item modal (no typing required)
const COLOR_PRESETS = [
  {name:'Black', hex:'#232019'}, {name:'White', hex:'#f8f6f0'}, {name:'Grey', hex:'#9a948a'},
  {name:'Charcoal', hex:'#3a3632'}, {name:'Navy', hex:'#233047'}, {name:'Denim Blue', hex:'#5b7c99'},
  {name:'Beige', hex:'#e6d8bd'}, {name:'Tan', hex:'#c9a06a'}, {name:'Brown', hex:'#6b4a33'},
  {name:'Cream', hex:'#f2ead8'}, {name:'Red', hex:'#b23a3a'}, {name:'Rust', hex:'#b5542d'},
  {name:'Orange', hex:'#d97b3f'}, {name:'Mustard', hex:'#cf9d34'}, {name:'Olive', hex:'#767a4d'},
  {name:'Green', hex:'#4f7a52'}, {name:'Teal', hex:'#3f8079'}, {name:'Blue', hex:'#3d6ea5'},
  {name:'Purple', hex:'#6d5b8a'}, {name:'Pink', hex:'#d98fa3'}, {name:'Burgundy', hex:'#6e2b3a'}
];
function hexToHSL(hex){
  hex = (hex||'').replace('#','');
  if(hex.length===3) hex = hex.split('').map(c=>c+c).join('');
  if(hex.length!==6) return {h:0,s:0,l:50};
  const r=parseInt(hex.substr(0,2),16)/255, g=parseInt(hex.substr(2,2),16)/255, b=parseInt(hex.substr(4,2),16)/255;
  const max=Math.max(r,g,b), min=Math.min(r,g,b);
  let h=0, l=(max+min)/2, s=0;
  const d=max-min;
  if(d!==0){
    s = d/(1-Math.abs(2*l-1));
    if(max===r) h=((g-b)/d)%6; else if(max===g) h=(b-r)/d+2; else h=(r-g)/d+4;
    h*=60; if(h<0) h+=360;
  }
  return {h, s:s*100, l:l*100};
}
function familyFromHex(hex){
  const {h,s,l} = hexToHSL(hex);
  if(s<15 || l>92 || l<10) return 'neutral';
  if(h<20 || h>=330) return 'warm';
  if(h<70) return 'warm';
  if(h<260) return 'cool';
  if(h<330) return 'bright';
  return 'neutral';
}
function hexToRgb(hex){
  hex = (hex||'').replace('#','');
  if(hex.length===3) hex = hex.split('').map(c=>c+c).join('');
  if(hex.length!==6) return {r:200,g:200,b:200};
  return { r:parseInt(hex.substr(0,2),16), g:parseInt(hex.substr(2,2),16), b:parseInt(hex.substr(4,2),16) };
}
function rgbToHex(r,g,b){
  return '#' + [r,g,b].map(v=> Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
}
// Finds the closest preset swatch to a detected/custom hex, by simple RGB distance.
function nearestPreset(hex){
  const t = hexToRgb(hex);
  let best = COLOR_PRESETS[0], bestDist = Infinity;
  for(const p of COLOR_PRESETS){
    const c = hexToRgb(p.hex);
    const d = (c.r-t.r)**2 + (c.g-t.g)**2 + (c.b-t.b)**2;
    if(d<bestDist){ bestDist=d; best=p; }
  }
  return best;
}
// Samples the average color of a photo's actual (non-transparent) pixels to guess
// its dominant color — works best on background-removed photos, since the
// transparent parts are skipped rather than dragging the average toward a background.
async function detectDominantColorHex(dataUrl){
  try{
    const img = await loadImageEl(dataUrl);
    const size = 60;
    const canvas = document.createElement('canvas');
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext('2d', { willReadFrequently:true });
    ctx.drawImage(img, 0, 0, size, size);
    const { data } = ctx.getImageData(0, 0, size, size);
    let r=0,g=0,b=0,count=0;
    for(let i=0; i<data.length; i+=4){
      const alpha = data[i+3];
      if(alpha < 200) continue; // skip transparent/near-transparent background pixels
      r += data[i]; g += data[i+1]; b += data[i+2]; count++;
    }
    if(count===0) return null;
    return rgbToHex(r/count, g/count, b/count);
  }catch(e){ console.error('color detection failed', e); return null; }
}
const NEUTRAL_WORDS = ['black','white','grey','gray','beige','tan','cream','ivory','navy','brown','denim','charcoal','khaki','stone','taupe','camel'];
const WARM_WORDS = ['red','orange','yellow','rust','terracotta','coral','burgundy','maroon','mustard','peach','brick','gold','wine','rose'];
const COOL_WORDS = ['blue','green','teal','purple','lavender','mint','turquoise','indigo','olive','sage','emerald','violet','cobalt'];
const BRIGHT_WORDS = ['pink','magenta','fuchsia','multicolor','print','patterned','floral','neon'];
function colorFamily(item){
  if(!item) return 'neutral';
  const name = (item.color||'').toLowerCase();
  // Recognized "wardrobe neutral" names (navy, denim, olive-drab tones, etc.) pair with
  // everything by styling convention, regardless of their raw hue.
  if(name && NEUTRAL_WORDS.some(w=>name.includes(w))) return 'neutral';
  // Otherwise, prefer the actual selected hex — more accurate than guessing from a label.
  if(item.colorHex) return familyFromHex(item.colorHex);
  if(name){
    if(WARM_WORDS.some(w=>name.includes(w))) return 'warm';
    if(COOL_WORDS.some(w=>name.includes(w))) return 'cool';
    if(BRIGHT_WORDS.some(w=>name.includes(w))) return 'bright';
  }
  return 'neutral'; // unrecognized/blank color treated as a wildcard, not penalized
}
function pairScore(famA, famB){
  // Two neutrals, or one neutral + anything: safe and easy, but not as
  // deliberately "styled" as two colors from the same family.
  if(famA==='neutral' && famB==='neutral') return 1.5;
  if(famA==='neutral' || famB==='neutral') return 1.5;
  // Same non-neutral family (two warms, or two cools): a genuine color match.
  if(famA===famB) return 2;
  // Warm vs. cool with no neutral to bridge them: the classic clash.
  if((famA==='warm'&&famB==='cool')||(famA==='cool'&&famB==='warm')) return -2;
  // A bright/bold color as a single accent works well; two brights together is busy.
  if(famA==='bright' && famB==='bright') return -1;
  if(famA==='bright' || famB==='bright') return 0.5;
  return 0;
}
function comboColorScore(items){
  const fams = items.map(i=>colorFamily(i));
  let total=0, count=0;
  for(let i=0;i<fams.length;i++){
    for(let j=i+1;j<fams.length;j++){ total += pairScore(fams[i],fams[j]); count++; }
  }
  if(count===0) return 1.5;
  return total/count;
}
function occasionMatch(item, occasion){
  if(!occasion) return true;
  if(!item.vibes || item.vibes.length===0) return true;
  return item.vibes.includes(occasion);
}
function comboScoreOutOf10(items, occasion){
  if(!items || items.length===0) return 0;
  const colorAvg = comboColorScore(items); // ranges roughly -2 (clash) to 2 (great match)
  const colorNorm = Math.max(0, Math.min(10, (colorAvg+2)/4*10));
  const occFits = items.filter(i=>occasionMatch(i,occasion)).length / items.length;
  const occScore = occFits*10;
  const final = Math.round(colorNorm*0.7 + occScore*0.3);
  return Math.max(1, Math.min(10, final));
}
function comboReason(items, occasion){
  if(!items || items.length===0) return 'Add items to see a compatibility score';
  const colorAvg = comboColorScore(items);
  let reason;
  if(colorAvg>=1.75) reason='Strong color match';
  else if(colorAvg>=1.0) reason='Safe, easy pairing';
  else if(colorAvg>=0) reason='Could go either way';
  else reason='Colors may clash a bit';
  if(occasion){
    const allFit = items.every(i=>occasionMatch(i,occasion));
    reason += allFit ? `, fits ${VIBE_LABEL[occasion]}` : `, not all pieces tagged for ${VIBE_LABEL[occasion]}`;
  }
  return reason;
}
/* ---- Laundry helpers ---- */
function applyWear(item, dateStr){
  item.wearCount = (item.wearCount||0)+1;
  item.lastWorn = dateStr;
  item.wearHistory = [...(item.wearHistory||[]), dateStr].slice(-20);
  item.wearsSinceWash = (item.wearsSinceWash||0)+1;
  const threshold = (item.wearsBeforeWash!=null ? item.wearsBeforeWash : LAUNDRY_DEFAULT[item.category]) || 0;
  if(threshold>0 && item.wearsSinceWash>=threshold){ item.laundryStatus = 'dirty'; }
}
function markWashed(item){ item.wearsSinceWash = 0; item.laundryStatus = 'clean'; }

/* ============== IMAGE RESIZE ============== */
function fileToResizedDataURL(file, maxDim=700, quality=0.72){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let w=img.width, h=img.height;
        if(w>h && w>maxDim){ h = Math.round(h*maxDim/w); w=maxDim; }
        else if(h>=w && h>maxDim){ w = Math.round(w*maxDim/h); h=maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function loadImageEl(src){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    img.onload = ()=> resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}
function drawResizedCanvas(img, maxDim){
  let w=img.width, h=img.height;
  if(w>h && w>maxDim){ h = Math.round(h*maxDim/w); w=maxDim; }
  else if(h>=w && h>maxDim){ w = Math.round(w*maxDim/h); h=maxDim; }
  const canvas = document.createElement('canvas');
  canvas.width=w; canvas.height=h;
  canvas.getContext('2d').drawImage(img,0,0,w,h);
  return canvas;
}
async function resizeTransparentPng(blob, maxDim){
  const url = URL.createObjectURL(blob);
  try{
    const img = await loadImageEl(url);
    const canvas = drawResizedCanvas(img, maxDim); // canvas starts transparent; alpha is preserved
    return canvas.toDataURL('image/png');
  } finally { URL.revokeObjectURL(url); }
}
// Removes the background from a photo (in-browser, free, no API key) and keeps
// real transparency (rather than flattening onto a solid color) so items can
// visually overlap like actual garments in the Today "flat lay" view, and so
// each item blends cleanly into whatever card/frame background it's shown on.
// Runs the model in a Web Worker (proxyToWorker) so it doesn't lock up the page,
// and falls back to a plain resized photo if the model can't load (e.g. offline).
async function fileToProcessedDataURL(file, removeBg){
  if(!removeBg) return fileToResizedDataURL(file);
  try{
    const rawDataUrl = await new Promise((res,rej)=>{
      const r = new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file);
    });
    const img = await loadImageEl(rawDataUrl);
    const preCanvas = drawResizedCanvas(img, 800);
    const preDataUrl = preCanvas.toDataURL('image/png');
    // Let the browser paint the "removing background…" spinner before the heavy work starts.
    await new Promise(r=> requestAnimationFrame(()=> requestAnimationFrame(r)));
    const { removeBackground } = await import('https://esm.sh/@imgly/background-removal');
    const resultBlob = await removeBackground(preDataUrl, { proxyToWorker: true });
    return await resizeTransparentPng(resultBlob, 650);
  }catch(err){
    console.error('Background removal failed, using original photo instead:', err);
    toast("Couldn't remove background — used your original photo");
    return fileToResizedDataURL(file);
  }
}

// Simple alignment-guide silhouettes shown over the live camera feed, so
// photos come out reasonably consistent (same rough framing) across items.
function guideSvgForCategory(category){
  const stroke = 'rgba(255,255,255,0.9)';
  if(category==='bottom'){
    return `<svg viewBox="0 0 200 260" fill="none" stroke="${stroke}" stroke-width="4" stroke-linejoin="round">
      <path d="M55 10 H145 L150 60 L128 250 H104 L100 110 L96 250 H72 L50 60 Z"/>
    </svg>`;
  }
  if(category==='dress'){
    return `<svg viewBox="0 0 200 260" fill="none" stroke="${stroke}" stroke-width="4" stroke-linejoin="round">
      <path d="M80 8 L70 30 L40 55 L55 90 L75 75 L60 250 H140 L125 75 L145 90 L160 55 L130 30 L120 8 Q100 22 80 8 Z"/>
    </svg>`;
  }
  if(category==='shoes'){
    return `<svg viewBox="0 0 220 140" fill="none" stroke="${stroke}" stroke-width="4" stroke-linejoin="round">
      <path d="M15 110 Q15 90 35 85 L70 78 Q95 40 130 35 Q160 32 185 55 Q205 72 205 95 Q205 112 190 115 L25 118 Q15 118 15 110 Z"/>
    </svg>`;
  }
  if(category==='accessory'){
    return `<svg viewBox="0 0 200 200" fill="none" stroke="${stroke}" stroke-width="4">
      <circle cx="100" cy="100" r="80" stroke-dasharray="10 8"/>
    </svg>`;
  }
  // top & outerwear share a shirt/jacket silhouette
  return `<svg viewBox="0 0 200 220" fill="none" stroke="${stroke}" stroke-width="4" stroke-linejoin="round">
    <path d="M75 8 L100 20 L125 8 L165 35 L150 70 L128 58 L132 210 H68 L72 58 L50 70 L35 35 Z"/>
  </svg>`;
}
function guideHintForCategory(category){
  if(category==='bottom') return 'Lay your bottoms flat, waist at top';
  if(category==='dress') return 'Lay your dress flat, facing up';
  if(category==='shoes') return 'Center one shoe, side profile';
  if(category==='accessory') return 'Center the item in the circle';
  return 'Lay flat, facing up, sleeves out';
}
// Opens a full-screen camera view with a category-shaped alignment guide.
// Calls onCapture(file) with a captured photo (as a File), or does nothing if cancelled.
async function openCameraCapture(category, onCapture){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    toast("Camera isn't available in this browser — try uploading a photo instead.");
    return;
  }
  let stream = null;
  try{
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
  }catch(err){
    try{ stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false }); }
    catch(err2){
      console.error('Camera access failed', err2);
      toast("Couldn't access your camera — check permissions, or upload a photo instead.");
      return;
    }
  }
  const overlay = document.createElement('div');
  overlay.className = 'camera-overlay';
  overlay.innerHTML = `
    <div class="camera-video-wrap">
      <video id="camera-video" autoplay playsinline muted></video>
      <div class="camera-hint">${guideHintForCategory(category)}</div>
      <div class="camera-guide">${guideSvgForCategory(category)}</div>
    </div>
    <div class="camera-controls">
      <button class="camera-close" id="camera-close-btn">Cancel</button>
      <button class="camera-shutter" id="camera-shutter-btn" aria-label="Take photo"></button>
      <div class="camera-controls-spacer"></div>
    </div>
  `;
  document.body.appendChild(overlay);
  const video = overlay.querySelector('#camera-video');
  video.srcObject = stream;
  function stopAndClose(){
    stream.getTracks().forEach(t=> t.stop());
    overlay.remove();
  }
  overlay.querySelector('#camera-close-btn').addEventListener('click', stopAndClose);
  overlay.querySelector('#camera-shutter-btn').addEventListener('click', ()=>{
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth || 1080;
    canvas.height = video.videoHeight || 1440;
    canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
    canvas.toBlob((blob)=>{
      stopAndClose();
      if(!blob){ toast('Could not capture that photo — try again.'); return; }
      const file = new File([blob], 'capture.jpg', { type:'image/jpeg' });
      onCapture(file);
    }, 'image/jpeg', 0.9);
  });
}
